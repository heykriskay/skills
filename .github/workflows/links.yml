name: Links

# Checks every link in the Markdown files.
# Runs on changes to docs and once a week, since outside links break on their own.

on:
  pull_request:
    paths: ["**.md"]
  push:
    branches: [main]
    paths: ["**.md"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path node_modules '**/*.md'
          fail: true
