name: Release

# Run from the Actions tab: Release → Run workflow.
# Tags and releases the version in .claude-plugin/plugin.json,
# with that version's section of CHANGELOG.md as the notes.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI (for plugin validation)
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate
        run: ./scripts/validate.sh

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Bump the version in .claude-plugin/plugin.json first."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./scripts/release-notes.sh > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
